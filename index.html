<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Logística Monserrate - En Vivo</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#4A154B">

  <style>
    :root {
      --color-primary: #5c246f;
      --color-primary-dark: #3a1347;
      --color-accent: #d4af37;
      --color-bg-light: #f5f2f7;
      --color-card: rgba(255, 255, 255, 0.94);
      --color-text-main: #2b1d33;
      --color-text-sec: #63526e;
      --border-radius: 14px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; -webkit-tap-highlight-color: transparent; }
    body {
      background: #200b2b url('https://images.unsplash.com/photo-1596436889106-be35e843f974?auto=format&fit=crop&q=80&w=1000') no-repeat center center fixed;
      background-size: cover; color: var(--color-text-main); min-height: 100vh; padding-bottom: 30px;
    }
    .overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: linear-gradient(135deg, rgba(62, 19, 77, 0.92) 0%, rgba(26, 6, 33, 0.96) 100%); z-index: 1; }
    .app-container { position: relative; z-index: 2; max-width: 480px; margin: 0 auto; padding: 16px; }
    
    .sync-badge {
      background: rgba(13, 122, 87, 0.2); color: #87f5d0; border: 1px solid #0d7a57;
      font-size: 11px; padding: 4px 10px; border-radius: 20px; display: flex; align-items: center; gap: 4px;
    }
    .sync-badge.loading { background: rgba(234, 179, 8, 0.2); color: #fef08a; border: 1px solid #ca8a04; }

    .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; padding: 4px; }
    .title-area { color: #ffffff; }
    .title { font-size: 22px; font-weight: 600; letter-spacing: -0.5px; display: flex; align-items: center; gap: 8px; }
    .title i { color: var(--color-accent); }
    .subtitle { font-size: 13px; color: #cfc2d8; margin-top: 2px; }

    .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 16px; }
    .stat-card { background: var(--color-card); border-radius: var(--border-radius); padding: 12px 6px; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.15); backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,0.1); }
    .stat-num { font-size: 20px; font-weight: 600; }
    .stat-label { font-size: 10px; color: var(--color-text-sec); font-weight: 500; text-transform: uppercase; margin-top: 2px; }
    .n-total { color: var(--color-primary-dark); }
    .n-avail { color: #0d7a57; }
    .n-paid { color: #3e7d07; }
    .n-abono { color: #1a62a6; }

    .tabs-nav { display: grid; grid-template-columns: 1fr 1fr; background: rgba(255, 255, 255, 0.15); padding: 4px; border-radius: 30px; margin-bottom: 16px; backdrop-filter: blur(10px); }
    .tab-btn { padding: 10px; border: none; background: none; color: #ffffff; font-size: 14px; font-weight: 500; border-radius: 25px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; transition: all 0.2s; }
    .tab-btn.active { background: var(--color-card); color: var(--color-primary-dark); box-shadow: 0 4px 10px rgba(0,0,0,0.1); }

    .bus-container { background: var(--color-card); border-radius: 24px; padding: 20px 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); border: 1px solid rgba(255,255,255,0.2); }
    .driver-row { display: flex; justify-content: space-between; align-items: center; background: var(--color-bg-light); padding: 10px 14px; border-radius: var(--border-radius); margin-bottom: 14px; border: 1px solid #e2dae8; }
    .driver-info { font-size: 12px; font-weight: 500; color: var(--color-primary-dark); display: flex; align-items: center; gap: 6px; }
    .aisle-text { text-align: center; font-size: 11px; color: var(--color-text-sec); font-weight: 500; margin-bottom: 12px; letter-spacing: 1px; }
    
    .bus-grid { display: flex; flex-direction: column; gap: 6px; }
    .bus-row { display: grid; grid-template-columns: 1fr 1fr 24px 1fr 1fr; gap: 5px; align-items: center; }
    .aisle-space { background: transparent; }
    
    .seat {
      width: 100%; aspect-ratio: 1; border-radius: 8px; border: 1px solid #d4cbdc; background: #ffffff;
      font-size: 11px; font-weight: 600; color: var(--color-text-main); display: flex; flex-direction: column;
      align-items: center; justify-content: center; position: relative; box-shadow: inset 0 -3px 0 rgba(0,0,0,0.05);
    }
    .seat .sname { font-size: 8px; font-weight: 400; max-width: 42px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; margin-top: 1px; }

    .seat.s-free { background: #ffffff; border-color: #cbd5e1; }
    .seat.s-paid { background: #e6f4ea; border-color: #34a853; color: #137333; }
    .seat.s-abono { background: #e8f0fe; border-color: #1a73e8; color: #174ea6; }
    .seat.s-taken { background: #f1f3f4; border-color: #dadce0; color: #5f6368; }

    .back-row-5 { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; margin-top: 6px; }
    
    .legend-box { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; margin-top: 16px; background: rgba(255,255,255,0.08); padding: 10px; border-radius: 12px; }
    .leg-item { display: flex; align-items: center; gap: 5px; font-size: 11px; color: #ffffff; }
    .leg-dot { width: 12px; height: 12px; border-radius: 3px; }

    .list-box { background: var(--color-card); border-radius: 24px; padding: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
    .list-actions { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
    .list-title { font-size: 16px; font-weight: 600; color: var(--color-primary-dark); }
    .btn-action { padding: 8px 12px; font-size: 12px; font-weight: 500; border-radius: 8px; border: 1px solid #d4cbdc; background: #ffffff; cursor: pointer; display: flex; align-items: center; gap: 4px; color: var(--color-text-main); }
    .btn-action:active { background: #f5f2f7; }

    .filters-row { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 12px; }
    .filter-chip { padding: 6px 14px; font-size: 12px; border-radius: 20px; border: 1px solid #d4cbdc; background: #ffffff; white-space: nowrap; color: var(--color-text-sec); }
    .filter-chip.active { background: var(--color-primary); color: #ffffff; border-color: var(--color-primary); }

    .p-list { display: flex; flex-direction: column; gap: 8px; }
    .p-card { display: flex; align-items: center; gap: 12px; padding: 12px; background: #ffffff; border-radius: 12px; border: 1px solid #e8e3ed; }
    .p-order-badge { width: 32px; height: 32px; border-radius: 50%; background: var(--color-bg-light); color: var(--color-primary); font-weight: 600; font-size: 12px; display: flex; align-items: center; justify-content: center; border: 1px solid #e2dae8; }
    .p-main-info { flex: 1; }
    .p-row1 { font-size: 14px; font-weight: 500; display: flex; align-items: center; gap: 6px; }
    .p-row2 { font-size: 11px; color: var(--color-text-sec); margin-top: 1px; }

    .badge-status { font-size: 9px; padding: 2px 6px; border-radius: 6px; font-weight: 600; }
    .bs-paid { background: #e6f4ea; color: #137333; }
    .bs-abono { background: #e8f0fe; color: #174ea6; }
    .bs-none { background: #f1f3f4; color: #5f6368; }

    .modal-mask { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.6); z-index: 100; display: flex; align-items: center; justify-content: center; padding: 16px; backdrop-filter: blur(4px); }
    .modal-box { background: #ffffff; border-radius: 20px; width: 100%; max-width: 360px; padding: 20px; box-shadow: 0 15px 40px rgba(0,0,0,0.3); animation: zoomUp 0.2s ease-out; }
    @keyframes zoomUp { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }

    .m-title { font-size: 18px; font-weight: 600; color: var(--color-primary-dark); }
    .m-sub { font-size: 12px; color: var(--color-text-sec); margin-bottom: 14px; }
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 12px; font-weight: 500; color: var(--color-text-main); margin-bottom: 4px; }
    .form-group input { width: 100%; padding: 10px 12px; font-size: 14px; border: 1px solid #cbd5e1; border-radius: 10px; outline: none; }
    .form-group input:focus { border-color: var(--color-primary); }

    .pay-selector { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
    .pay-btn { padding: 8px 4px; font-size: 12px; font-weight: 500; border-radius: 8px; border: 1px solid #cbd5e1; background: #ffffff; text-align: center; cursor: pointer; color: var(--color-text-sec); }
    .pay-btn.selected.p-none { background: #f1f3f4; border-color: #9aa0a6; color: #3c4043; font-weight:600; }
    .pay-btn.selected.p-paid { background: #e6f4ea; border-color: #34a853; color: #137333; font-weight:600; }
    .pay-btn.selected.p-abono { background: #e8f0fe; border-color: #1a73e8; color: #174ea6; font-weight:600; }

    .m-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 18px; }
    .btn-main { padding: 11px; border-radius: 10px; font-size: 14px; font-weight: 500; border: none; cursor: pointer; text-align: center; }
    .btn-main.primary { background: var(--color-primary); color: #ffffff; }
    .btn-main.secondary { background: #f1f3f4; color: var(--color-text-main); }
    
    .btn-delete-seat { width: 100%; padding: 10px; background: #fce8e6; color: #c5221f; border: none; border-radius: 10px; margin-top: 8px; font-size: 12px; font-weight: 500; cursor: pointer; }
    .empty-state { text-align: center; padding: 30px; color: var(--color-text-sec); font-size: 13px; }
  </style>
</head>
<body>

  <div class="overlay"></div>

  <div class="app-container">
    
    <div class="header">
      <div class="title-area">
        <div class="title"><i class="ti ti-flame"></i> Monserrate 2026</div>
        <div class="subtitle">Bucaramanga → Bogotá · 42 Puestos</div>
      </div>
      <div class="sync-badge loading" id="syncStatus"><i class="ti ti-refresh animate-spin"></i> Conectando...</div>
    </div>

    <div class="stats-grid">
      <div class="stat-card"><div class="stat-num n-total" id="txtTotal">42</div><div class="stat-label">Total</div></div>
      <div class="stat-card"><div class="stat-num n-avail" id="txtAvail">42</div><div class="stat-label">Libres</div></div>
      <div class="stat-card"><div class="stat-num n-paid" id="txtPaid">0</div><div class="stat-label">Pagos</div></div>
      <div class="stat-card"><div class="stat-num n-abono" id="txtAbono">0</div><div class="stat-label">Abonos</div></div>
    </div>

    <div class="tabs-nav">
      <button class="tab-btn active" id="btn-tab-bus" onclick="changeTab('bus')"><i class="ti ti-bus"></i> Croquis Bus</button>
      <button class="tab-btn" id="btn-tab-list" onclick="changeTab('list')"><i class="ti ti-users"></i> Lista Ventas</button>
    </div>

    <div id="view-bus">
      <div class="bus-container">
        <div class="driver-row">
          <div class="driver-info"><i class="ti ti-steering-wheel"></i> Conductor Principal</div>
          <div class="driver-info" style="color: #9aa0a6;">Puerta <i class="ti ti-door-enter"></i></div>
        </div>
        <div class="aisle-text">← VENTANA | PASILLO | VENTANA →</div>
        <div class="bus-grid" id="busRowsContainer"></div>
        <div class="back-row-5" id="busBackRowContainer"></div>
      </div>

      <div class="legend-box">
        <div class="leg-item"><div class="leg-dot" style="background:#ffffff; border:1px solid #cbd5e1;"></div> Disponible</div>
        <div class="leg-item"><div class="leg-dot" style="background:#e6f4ea;"></div> Pagó todo</div>
        <div class="leg-item"><div class="leg-dot" style="background:#e8f0fe;"></div> Con Abono</div>
        <div class="leg-item"><div class="leg-dot" style="background:#f1f3f4;"></div> Reservado</div>
      </div>
    </div>

    <div id="view-list" style="display:none;">
      <div class="list-box">
        <div class="list-actions">
          <span class="list-title">Orden de Compra</span>
          <button class="btn-action" id="btnCopyList"><i class="ti ti-copy"></i> Copiar WhatsApp</button>
        </div>
        
        <div class="filters-row">
          <button class="filter-chip active" id="f-all" onclick="filterList('all')">Todos</button>
          <button class="filter-chip" id="f-paid" onclick="filterList('paid')">Pagaron</button>
          <button class="filter-chip" id="f-abono" onclick="filterList('abono')">Abonaron</button>
          <button class="filter-chip" id="f-none" onclick="filterList('none')">Sin Pago</button>
        </div>

        <div class="p-list" id="passengerList"></div>
        <div class="empty-state" id="emptyState" style="display:none;">No se han encontrado pasajeros.</div>
      </div>
    </div>

  </div>

  <div class="modal-mask" id="modalForm" style="display:none;">
    <div class="modal-box">
      <div class="m-title" id="lblModalTitle">Asignar Puesto</div>
      <div class="m-sub" id="lblModalSub">Ubicación del asiento</div>
      
      <div class="form-group">
        <label>Nombre del Pasajero *</label>
        <input type="text" id="txtNom" placeholder="Ej. Juan Pérez" autocomplete="off">
      </div>
      <div class="form-group">
        <label>Cédula (Opcional)</label>
        <input type="number" id="txtCc" placeholder="Ej. 1098XXXX" inputmode="numeric">
      </div>
      <div class="form-group">
        <label>Celular</label>
        <input type="tel" id="txtTel" placeholder="Ej. 315XXXXXXX">
      </div>
      
      <div class="form-group">
        <label>Estado del Pago</label>
        <div class="pay-selector">
          <button class="pay-btn p-none" id="pb-none" onclick="setFormPay('none')">Sin pago</button>
          <button class="pay-btn p-paid" id="pb-paid" onclick="setFormPay('paid')">Pagó Todo</button>
          <button class="pay-btn p-abono" id="pb-abono" onclick="setFormPay('abono')">Abono</button>
        </div>
      </div>

      <div class="form-group" id="groupAbono" style="display:none;">
        <label>¿Cuánto abonó? ($)</label>
        <input type="number" id="txtMontoAbono" placeholder="Ej. 50000" inputmode="numeric">
      </div>

      <div class="m-actions">
        <button class="btn-main secondary" onclick="closeModal()">Cancelar</button>
        <button class="btn-main primary" id="btnSave" onclick="processSave()">Guardar</button>
      </div>
      <button class="btn-delete-seat" id="btnDeleteSeat" onclick="processDelete()" style="display:none;"><i class="ti ti-trash"></i> Liberar Puesto</button>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://fagmooucdoevtgvkvmym.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZhZ21vb3VjZG9ldnRndmt2bXltIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkyNDEzNjEsImV4cCI6MjA5NDgxNzM2MX0.rl_Dh5qB63Ir1vyO0uz75LejEhBwjGeSKO0yE4_ni7w";
    
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    const TOTAL_SEATS = 42;
    
    let db = {}; 
    let currentSeatEditing = null;
    let selectedPayState = 'none';
    let activeFilter = 'all';

    async function fetchAllSeats() {
      showSyncState(true);
      
      // Siempre renderizar el mapa vacío para evitar que se quede colgada la pantalla
      renderBus();
      updateCounters();

      const { data, error } = await _supabase.from('peregrinos').select('*');
      if (error) {
        console.error("Error cargando base de datos remota:", error);
        showSyncState(false);
        return;
      }
      
      db = {};
      if (data && data.length > 0) {
        data.forEach(item => {
          db[item.id] = {
            name: item.name,
            cc: item.cc,
            tel: item.tel,
            pay: item.pay,
            monto: item.monto,
            order: item.order
          };
        });
      }
      
      // Volver a renderizar ya con los datos cargados de Supabase
      renderBus();
      updateCounters();
      if(document.getElementById('view-list').style.display === 'block') renderList();
      showSyncState(false);
    }

    function listenRealtime() {
      _supabase
        .channel('schema-db-changes')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'peregrinos' }, () => {
          fetchAllSeats();
        })
        .subscribe();
    }

    function showSyncState(isLoading) {
      const b = document.getElementById('syncStatus');
      if(isLoading) {
        b.className = "sync-badge loading";
        b.innerHTML = `<i class="ti ti-refresh animate-spin"></i> Sincronizando...`;
      } else {
        b.className = "sync-badge";
        b.innerHTML = `<i class="ti ti-cloud-check"></i> En Vivo`;
      }
    }

    function getSeatDetails(n) {
      if(n <= 40) {
        const fila = Math.ceil(n / 4);
        const mod = (n - 1) % 4;
        let pos = "";
        if (mod === 0) pos = "Izquierda Ventana";
        else if (mod === 1) pos = "Izquierda Pasillo";
        else if (mod === 2) pos = "Derecha Pasillo";
        else if (mod === 3) pos = "Derecha Ventana";
        return { fila, desc: `Fila ${fila} · ${pos}` };
      } else {
        return { fila: 11, desc: `Última Fila Trasera · Puesto ${n === 41 ? 'Izquierdo' : 'Derecho'}` };
      }
    }

    function getNextAvailableSeat() {
      for(let i = 1; i <= TOTAL_SEATS; i++) {
        if(!db[i]) return i;
      }
      return null;
    }

    function renderBus() {
      const rowsContainer = document.getElementById('busRowsContainer');
      const backRowContainer = document.getElementById('busBackRowContainer');
      if(!rowsContainer || !backRowContainer) return;
      
      rowsContainer.innerHTML = '';
      backRowContainer.innerHTML = '';

      for(let f = 1; f <= 10; f++) {
        const rowDiv = document.createElement('div');
        rowDiv.className = 'bus-row';
        const base = (f - 1) * 4;
        const seatNumbers = [base + 1, base + 2, base + 3, base + 4];

        seatNumbers.forEach((n, idx) => {
          if(idx === 2) {
            const aisle = document.createElement('div');
            aisle.className = 'aisle-space';
            rowDiv.appendChild(aisle);
          }

          const seatBtn = document.createElement('button');
          let cssClass = 'seat s-free';
          const p = db[n];
          
          if(p) {
            if(p.pay === 'paid') cssClass = 'seat s-paid';
            else if(p.pay === 'abono') cssClass = 'seat s-abono';
            else cssClass = 'seat s-taken';
          }

          seatBtn.className = cssClass;
          seatBtn.innerHTML = `<span class="snum">${n}</span>${p ? `<span class="sname">${p.name.split(' ')[0]}</span>` : ''}`;
          seatBtn.onclick = () => openModal(n);
          rowDiv.appendChild(seatBtn);
        });
        rowsContainer.appendChild(rowDiv);
      }

      [41, 42].forEach((n, idx) => {
        if(idx === 1) {
          for(let k=0; k<3; k++) {
            const space = document.createElement('div');
            space.className = 'aisle-space';
            backRowContainer.appendChild(space);
          }
        }
        const p = db[n];
        const seatBtn = document.createElement('button');
        let cssClass = 'seat s-free';
        
        if(p) {
          if(p.pay === 'paid') cssClass = 'seat s-paid';
          else if(p.pay === 'abono') cssClass = 'seat s-abono';
          else
